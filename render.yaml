# Render Blueprint：一键部署配置
# 用法：点击 README 中的 "Deploy to Render" 按钮（或 New + Blueprint 选择本仓库），
# Render 会自动创建下面的 PostgreSQL 数据库、后端和前端服务并部署。

databases:
  - name: laf-db
    databaseName: lost_found
    user: laf_user
    plan: free

services:
  # 后端 API 服务（FastAPI）
  - type: web
    name: backend
    rootDir: backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: laf-db
          property: connectionString
      - key: PORT
        value: "8000"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: admin123456
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat

  # 前端服务（Nginx 托管 SPA，并把 /api 代理到后端）
  - type: web
    name: frontend
    rootDir: frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: ""
